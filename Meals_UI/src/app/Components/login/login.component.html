<div class="auth-container">
  <div class="auth-card">
    <h1>Log In</h1>
    <p class="auth-prompt">Don't have an account? <a href="/register">Create New Account</a></p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
      <!-- Email -->
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" class="form-input" placeholder="Enter your email" />

        <div class="error-feedback" *ngIf="hasDisplayableError('email')">
          <div *ngIf="form.controls.email.hasError('required')">
            Please enter your email address
          </div>
          <div *ngIf="form.controls.email.hasError('email')">
            Please enter a valid email address
          </div>
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label>Password</label>
        <div class="password-container">
          <input [type]="showPassword ? 'text' : 'password'" formControlName="password" class="form-input"
            placeholder="Enter your password">
          <button type="button" class="password-toggle" (click)="togglePasswordVisibility()">
            {{ showPassword ? '🙈' : '👁' }}
          </button>
        </div>
        <div class="error-feedback" *ngIf="hasDisplayableError('password')">
          <div *ngIf="form.controls.password.hasError('required')">
            Please enter your password
          </div>
        </div>
      </div>

      <button type="submit" class="auth-button">Log In</button>
    </form>
  </div>
</div>
